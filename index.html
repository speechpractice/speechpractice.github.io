<style>
/* Layout: one calm column, one big action per screen; large type and tap targets for shaky hands. */
:root {
  --bg: #eef4f3;
  --surface: #ffffff;
  --ink: #12302e;
  --muted: #4d6764;
  --line: #cfdedb;
  --teal: #1d6b64;
  --teal-soft: #d6ebe8;
  --marigold: #f0a020;
  --marigold-ink: #3a2400;
  --good: #2e8540;
  --warn: #b5560f;
  --meter-bg: #dde8e6;
  --display: "Lexend", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --radius: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1c1b; --surface: #15292a; --ink: #e7f2f0; --muted: #a3bcb8; --line: #2a4543;
    --teal: #5fc2b6; --teal-soft: #1d3a38; --marigold: #f4b13d; --marigold-ink: #2a1a00;
    --good: #6cc77d; --warn: #f0965a; --meter-bg: #22393a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1c1b; --surface: #15292a; --ink: #e7f2f0; --muted: #a3bcb8; --line: #2a4543;
  --teal: #5fc2b6; --teal-soft: #1d3a38; --marigold: #f4b13d; --marigold-ink: #2a1a00;
  --good: #6cc77d; --warn: #f0965a; --meter-bg: #22393a; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: 20px; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.5; }
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.25; margin: 0; text-wrap: balance; }
h1 { font-size: 1.7rem; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font-family: var(--display); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
:lang(ta) { font-family: "Noto Sans Tamil", "Latha", "Tamil Sangam MN", var(--body); }

button { font: inherit; cursor: pointer; border: 0; border-radius: var(--radius); }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--marigold); outline-offset: 3px; }
.btn { min-height: 64px; padding: 14px 22px; font-family: var(--display); font-weight: 600; font-size: 1.05rem; display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; text-align: center; }
.btn-primary { background: var(--marigold); color: var(--marigold-ink); }
.btn-teal { background: var(--teal); color: var(--surface); }
.btn-ghost { background: var(--teal-soft); color: var(--ink); }
.btn-big { min-height: 96px; font-size: 1.4rem; }

.card { background: var(--surface); border-radius: var(--radius); padding: 20px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.top > div { min-width: 0; }
.top-actions { display: flex; gap: 8px; flex: none; }
.icon-btn { background: var(--teal-soft); color: var(--ink); min-width: 56px; min-height: 56px; padding: 0 14px; font-size: .85rem; font-family: var(--display); font-weight: 600; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--teal-soft); border-radius: 14px; padding: 12px; text-align: center; }
.stat b { display: block; font-family: var(--display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .72rem; color: var(--muted); }

.ex-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.ex-item { display: flex; align-items: center; gap: 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; width: 100%; text-align: start; color: var(--ink); min-height: 64px; }
.ex-item .chk { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); display: grid; place-items: center; font-weight: 700; color: var(--surface); }
.ex-item.done .chk { background: var(--good); border-color: var(--good); }
.ex-item .t { flex: 1; min-width: 0; }
.ex-item .t b { font-family: var(--display); font-weight: 600; display: block; }
.ex-item .t small { color: var(--muted); font-size: .78rem; }

.lang-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.lang-btn { min-height: 64px; background: var(--surface); border: 2px solid var(--line); color: var(--ink); font-size: 1.1rem; font-weight: 600; padding: 10px; }
.lang-btn.on { border-color: var(--marigold); background: var(--teal-soft); }

/* exercise screen */
.prompt { font-family: var(--display); font-weight: 700; font-size: 2.2rem; text-align: center; line-height: 1.3; padding: 18px 8px; overflow-wrap: anywhere; }
.prompt.long { font-size: 1.5rem; }
.prompt:lang(ta) { font-family: "Noto Sans Tamil", "Latha", "Tamil Sangam MN", sans-serif; font-size: 1.8rem; line-height: 1.5; padding-bottom: 4px; }
.prompt.long:lang(ta) { font-size: 1.45rem; }
.prompt-sub { text-align: center; display: flex; flex-direction: column; gap: 2px; }
.prompt-sub b { font-family: var(--display); font-size: 1.15rem; }
.prompt-sub span { color: var(--muted); font-size: .9rem; }
.timer { font-family: var(--display); font-weight: 700; font-size: 4.5rem; text-align: center; font-variant-numeric: tabular-nums; line-height: 1; }
.timer small { font-size: 1.2rem; color: var(--muted); }
.reps { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.reps i { width: 18px; height: 18px; border-radius: 50%; background: var(--meter-bg); display: block; }
.reps i.on { background: var(--teal); }
.reps i.now { background: var(--marigold); }

.meter { display: flex; flex-direction: column; gap: 6px; }
.meter-track { position: relative; height: 40px; background: var(--meter-bg); border-radius: 12px; overflow: hidden; }
.meter-fill { position: absolute; inset-block: 0; inset-inline-start: 0; width: 0%; background: var(--teal); transition: width .08s linear; }
.meter-fill.loud { background: var(--good); }
.meter-target { position: absolute; top: 0; bottom: 0; width: 4px; background: var(--marigold); }
.meter-label { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); }
.meter-say { text-align: center; font-family: var(--display); font-weight: 700; font-size: 1.3rem; min-height: 1.6em; }
.meter-say.good { color: var(--good); }
.meter-say.warn { color: var(--warn); }

.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--body); font-size: 17px; }
.note { font-size: .8rem; color: var(--muted); }
.tip { background: var(--teal-soft); border-radius: 14px; padding: 14px 16px; font-size: .95rem; }

label { font-family: var(--display); font-weight: 600; font-size: .9rem; display: flex; flex-direction: column; gap: 6px; }
input, textarea, select { font: inherit; font-size: 1rem; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
textarea { min-height: 200px; resize: vertical; }
select { font-size: .9rem; text-overflow: ellipsis; }
.safety { border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; font-size: .85rem; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
.safety b { color: var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.full-terms summary { cursor: pointer; color: var(--teal); text-decoration: underline; min-height: 44px; display: flex; align-items: center; font-weight: 600; }
.full-terms { display: flex; flex-direction: column; gap: 10px; }
.linkish { background: none; padding: 0; color: var(--teal); text-decoration: underline; font-size: .9rem; text-align: start; min-height: 44px; }
.about { margin: 0; padding-inline-start: 1.2em; display: flex; flex-direction: column; gap: 8px; font-size: .9rem; }
label.check-row { flex-direction: row; align-items: flex-start; gap: 12px; font-weight: 600; }
input[type="checkbox"] { width: 28px; height: 28px; flex: none; accent-color: var(--teal); }

.celebrate { text-align: center; font-size: 4rem; line-height: 1; }
@media (prefers-reduced-motion: no-preference) {
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.03); } }
}

      reading: ["每天早上我在窗边喝茶。|Měitiān zǎoshang wǒ zài chuāng biān hē chá.|Every morning I drink tea by the window.", "孙子孙女们喜欢听我讲故事。|Sūnzi sūnnǚmen xǐhuan tīng wǒ jiǎng gùshi.|My grandchildren love to hear my stories.", "市场上有新鲜的花卖。|Shìchǎng shàng yǒu xīnxiān de huā mài.|Fresh flowers are sold at the market.", "傍晚的钟声又响亮又清楚。|Bàngwǎn de zhōngshēng yòu xiǎngliàng yòu qīngchu.|The evening bells are loud and clear.", "我说话大声又清楚，大家都能听见。|Wǒ shuōhuà dàshēng yòu qīngchu, dàjiā dōu néng tīngjiàn.|I speak loudly and clearly, so everyone can hear me."]

ith me.", "यह अच्छा विचार है!|Yeh achchha vichaar hai!|That's a good idea!", "शुभ रात्रि, अच्छे से सोना।|Shubh raatri, achchhe se sona.|Good night, sleep well."],

      read: { how: "Read each sentence slowly. Pause at each comma and full stop, and make every sound clear.", tip: "Slow and clear." }
    },
    tbi: {
      phrases: { name: "Slow, clear phrases", short: "Every sound clear, then normal speed", how: "Say each phrase slowly, one syllable at a time, like tapping a beat. Make every sound clear. Then say it once more at your normal speed, still clear and strong.", tip: "Clear first, then speed." },
      ptk: { how: "Say each sound slowly and clearly first. Speed up only while every sound stays clear.", tip: "Clear beats fast." }
    },
    ms: {
      ahh: { tip: "Strong but comfortable. Stop before you feel tired." },
      phrases: { tip: "Rest between phrases whenever you need." },
      breath: { tip: "Slow, calm breaths. Rest whenever you need." }
    },
    aging: {
      ahh: { tip: "Strong and easy. Never squeeze or strain your throat." },
      high: { tip: "Smooth and easy, with no strain." },
      low: { tip: "Smooth and easy, with no strain." }
    }
  };
  let EX = [];
  function buildPlan() {
    EX = (PLANS[S.condition] || PLANS.pd).steps.map(([id, opts]) => Object.assign({}, ALL_EX[id], opts || {}));
  }
  const repsFor = (ex) => ex.reps;
  const condText = () => COND_TEXT.en;
  function condOptions() {
    return CONDITIONS.map((c) => `<option value="${c}">${esc(condText().names[c])}</option>`).join("");
  }

  function applyLang() {
    document.documentElement.lang = "en";
    document.documentElement.dir = "ltr";
  }

  // ---------- dates / history ----------
  const dayKey = (d = new Date()) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const today = () => { const k = dayKey(); S.history[k] = S.history[k] || { done: {}, ahh: [] }; return S.history[k]; };
  const dayBest = (k) => { const h = S.history[k]; return h && h.ahh.length ? Math.max(...h.ahh) : 0; };
  const practiced = (k) => { const h = S.history[k]; return !!h && Object.keys(h.done).length > 0; };
  function streak() {
    let n = 0; const d = new Date();
    if (!practiced(dayKey(d))) d.setDate(d.getDate() - 1);
    while (practiced(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function weekCount() { let n = 0; const d = new Date(); for (let i = 0; i < 7; i++) { if (practiced(dayKey(d))) n++; d.setDate(d.getDate() - 1); } return n; }
  function bestEver() { return Math.max(0, ...Object.keys(S.history).map(dayBest)); }

  // ---------- microphone ----------
  const TARGETS = { easier: 0.45, normal: 0.6, harder: 0.72 };
  const mic = { state: "off", level: 0 };
  async function startMic() {
    if (mic.state === "on" || mic.state === "asking") return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { mic.state = "none"; return; }
    mic.state = "asking";
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const an = ctx.createAnalyser(); an.fftSize = 1024; ctx.createMediaStreamSource(stream).connect(an);
      const buf = new Float32Array(an.fftSize);
      mic.state = "on";
      const tick = () => {
        an.getFloatTimeDomainData(buf);
        let sum = 0; for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
        const db = 20 * Math.log10(Math.sqrt(sum / buf.length) + 1e-8); // dBFS, about -90..0
        mic.level = mic.level * 0.6 + Math.min(1, Math.max(0, (db + 60) / 55)) * 0.4;
        onLevel(mic.level);
        requestAnimationFrame(tick);
      };
      tick();
    } catch (e) { mic.state = "denied"; }
    if (current) renderMeterBox();
  }

  // ---------- speech (read instructions aloud) ----------
  function speak(text) {
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = 0.9; speechSynthesis.speak(u); } catch (e) {}
  }

  let current = null;
  let timerId = 0;

  function greeting() { const h = new Date().getHours(); return t(h < 12 ? "morning" : h < 17 ? "afternoon" : "evening"); }

        ${next ? `<button class="btn btn-primary btn-big pulse" id="go">${doneCount ? t("cont") : t("start")}: ${exT(next.id).name}</button>`
               : `<button class="btn btn-ghost" id="again">${t("again")}</button>`}
        <ul class="ex-list">
          ${EX.map((e) => `<li><button class="ex-item ${tdy.done[e.id] ? "done" : ""}" data-ex="${e.id}">

            <span class="t"><b>${exT(e.id).name}</b><small>${exT(e.id).short}</small></span></button></li>`).join("")}
        </ul>
      </div>

      <div class="card">

      <div class="tip">${S.condition === "pd" ? `<b>${t("tipTitle")}</b> ${t("tip")}` : `<b>${esc(condText().tips[S.condition][0])}</b> ${esc(condText().tips[S.condition][1])}`}</div>

    const again = app.querySelector("#again"); if (again) again.onclick = () => intro(EX[0]);

  // Anonymous milestone counts for the visitor counter. Never includes names or phrases.

  // Terms must be accepted once per device. Changing TERMS_VERSION asks everyone to accept again.
  const TERMS_VERSION = "2026-10-15";

  function welcome() {

  async function share() {
    track("share");
    const btn = app.querySelector("#share");
    try { if (navigator.share) { await navigator.share({ title: "Speech Practice", url: SHARE_URL }); return; } } catch (e) { return; }
    try { await navigator.clipboard.writeText(SHARE_URL); btn.textContent = t("copied") + " ✓"; }
    catch (e) { btn.textContent = SHARE_URL; }
  }

  function chart() {
    const days = []; const d = new Date(); d.setDate(d.getDate() - 13);
    for (let i = 0; i < 14; i++) { days.push({ label: d.getDate(), v: dayBest(dayKey(d)) }); d.setDate(d.getDate() + 1); }
    const max = Math.max(10, Math.ceil(Math.max(...days.map((x) => x.v)) / 5) * 5);
    const W = 560, H = 220, L0 = 34, B = 30, T = 12, bw = (W - L0) / 14;
    const y = (v) => T + (H - T - B) * (1 - v / max);
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("chartTitle"))}" direction="ltr">`;
    [0, max / 2, max].forEach((g) => { s += `<line x1="${L0}" x2="${W}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-width="1"/><text x="${L0 - 6}" y="${y(g) + 5}" text-anchor="end">${g}</text>`; });
    days.forEach((x, i) => {
      const cx = L0 + i * bw + bw * 0.18, w = bw * 0.64, isToday = i === 13;
      if (x.v > 0) s += `<rect x="${cx}" y="${y(x.v)}" width="${w}" height="${y(0) - y(x.v)}" rx="4" fill="${isToday ? "var(--marigold)" : "var(--teal)"}"/>`;
      else s += `<rect x="${cx}" y="${y(0) - 3}" width="${w}" height="3" rx="1.5" fill="var(--line)"/>`;
      s += `<text x="${cx + w / 2}" y="${H - 8}" text-anchor="middle">${x.label}</text>`;
    });
    return s + `</svg>`;
  }

  function intro(ex) {
    stopTimer();
    const tx = exT(ex.id);
    current = { ex, i: 0, phase: "intro", items: ex.type === "prompt" ? ex.items().slice(0, ex.limit || undefined) : null };
    current.total = current.items ? current.items.length : repsFor(ex);
    app.innerHTML = `
      <div class="top"><button class="icon-btn" id="back">${t("home")}</button><span class="eyebrow">${t("of", { i: EX.indexOf(ex) + 1, n: EX.length })}</span></div>
      <div class="card">
        <h1>${tx.name}</h1>
        <p style="font-size:1.15rem">${esc(tx.how)}</p>
        <p class="muted">${t(ex.type === "prompt" ? "toSay" : "times", { n: current.total })} · ${esc(tx.tip)}</p>
        ${ex.id === "phrases" && S.phraseMode !== "same" ? `<p class="note">${t("mixNote", { n: dailyCount() - CORE })}</p>` : ""}
        <button class="btn btn-ghost" id="hear">${t("hear")}</button>
      </div>
      <button class="btn btn-primary btn-big" id="begin">${t("begin")}</button>`;
    app.querySelector("#back").onclick = home;
    app.querySelector("#hear").onclick = () => speak(tx.name + ". " + tx.how + " " + tx.tip);
    app.querySelector("#begin").onclick = () => { startMic(); wake(); rep(); };
  }

  function repDots() {
    return `<div class="reps" aria-label="${esc(t("of", { i: current.i + 1, n: current.total }))}">${Array.from({ length: current.total }, (_, k) =>
      `<i class="${k < current.i ? "on" : k === current.i ? "now" : ""}"></i>`).join("")}</div>`;
  }

  function meterHTML() {
    if (mic.state === "on") {
      const tgt = TARGETS[S.target] * 100;
      return `<div class="meter"><div class="meter-track"><div class="meter-fill" id="mfill"></div><div class="meter-target" style="inset-inline-start:${tgt}%"></div></div>
        <div class="meter-label"><span>${t("soft")}</span><span>${t("target")} ▲</span><span>${t("loud")}</span></div>
        <div class="meter-say" id="msay" aria-live="polite"></div></div>`;
    }
    if (mic.state === "asking") return `<p class="note" style="text-align:center">${t("allowMic")}</p>`;
    if (mic.state === "denied" || mic.state === "none") return `<p class="note" style="text-align:center">${t("micOff")}</p>`;
    return "";
  }
  function renderMeterBox() { const box = document.getElementById("meterbox"); if (box) box.innerHTML = meterHTML(); }

  function onLevel(v) {
    const fill = document.getElementById("mfill"), say = document.getElementById("msay");
    const tgt = TARGETS[S.target];
    if (fill) { fill.style.width = (v * 100).toFixed(1) + "%"; fill.classList.toggle("loud", v >= tgt); }
    if (say) {
      if (v < 0.15) { say.textContent = ""; say.className = "meter-say"; }
      else if (v < tgt) { say.textContent = t("louder"); say.className = "meter-say warn"; }
      else { say.textContent = t("great"); say.className = "meter-say good"; }
    }
    if (current && current.phase === "holding") holdAuto(v);
  }

  function rep() {
    const { ex, i } = current;
    current.phase = "ready";
    let body = "";
    if (ex.type === "hold") body = `<div class="timer" id="clock">0.0<small>s</small></div>
        <button class="btn btn-teal btn-big" id="act">${t("holdBtn")}</button>`;
    else if (ex.type === "timed") body = `<div class="timer" id="clock">${ex.secs}<small>s</small></div>
        <button class="btn btn-teal btn-big" id="act">${t("tapAhh")}</button>`;
    else {
      const it = current.items[i];
      // English letters only: show the pronunciation as the main text. The meaning shows when the phrase is not in the app's language.
      const latin = S.script === "latin" && it.sound;
      const main = latin ? it.sound : it.text;
      const meaning = it.lang !== "en" ? it.meaning : "";
      const dir = latin ? "ltr" : (LANGS[it.lang].dir || "ltr");
      body = `<div class="prompt ${main.length > 30 ? "long" : ""}" lang="${latin ? "en" : it.lang}" dir="${dir}">${esc(main)}</div>`;
      const sound = S.script === "both" ? it.sound : "";
      if (sound || meaning) body += `<p class="prompt-sub" dir="ltr">${sound ? `<b>${esc(sound)}</b>` : ""}${meaning ? `<span>${esc(meaning)}</span>` : ""}</p>`;
      if (ex.id === "count" && S.practice !== "en") body += `<p class="prompt-sub"><span>${t("sayIn", { lang: LANGS[S.practice].name })}</span></p>`;
      body += `<button class="btn btn-teal btn-big" id="act">${i + 1 < current.total ? t("saidNext") : t("saidFinish")}</button>`;
    }
    app.innerHTML = `
      <div class="top"><button class="icon-btn" id="back">${t("home")}</button><h2>${exT(ex.id).name}</h2></div>
      ${repDots()}
      <div class="card">${body}<div id="meterbox">${meterHTML()}</div></div>
      <p class="muted" style="text-align:center">${esc(exT(ex.id).tip)}</p>`;
    app.querySelector("#back").onclick = home;
    const act = app.querySelector("#act");
    if (ex.type === "hold") act.onclick = () => current.phase === "holding" ? endHold() : startHold(act);
    else if (ex.type === "timed") act.onclick = () => startCountdown(act);
    else act.onclick = nextRep;
  }

  function startHold(btn) {
    current.phase = "holding"; current.t0 = performance.now(); current.heard = false; current.quietSince = 0;
    btn.textContent = t("stop"); btn.className = "btn btn-primary btn-big";
    const clock = document.getElementById("clock");
    timerId = setInterval(() => { clock.innerHTML = ((performance.now() - current.t0) / 1000).toFixed(1) + "<small>s</small>"; }, 100);
  }
  // With the mic on, stop by itself once the voice has started and then gone quiet for a moment.
  function holdAuto(v) {
    const now = performance.now();
    if (v > 0.3) { current.heard = true; current.quietSince = 0; current.lastVoice = now; }
    else if (current.heard) { if (!current.quietSince) current.quietSince = now; if (now - current.quietSince > 1200) endHold(current.lastVoice); }
  }
  function endHold(endAt) {
    if (current.phase !== "holding") return;
    stopTimer(); current.phase = "done";
    const secs = Math.max(0, ((endAt || performance.now()) - current.t0) / 1000);
    today().ahh.push(Math.round(secs * 10) / 10); save();
    const prevBest = Math.max(0, ...Object.keys(S.history).filter((k) => k !== dayKey()).map(dayBest));
    const msg = prevBest && secs > prevBest ? t("record") : secs >= 10 ? t("strong") : t("good");
    rest(secs.toFixed(1), msg, "s");
  }

  function startCountdown(btn) {
    btn.disabled = true; btn.textContent = t("holdIt");
    current.phase = "counting";
    const clock = document.getElementById("clock"); const end = performance.now() + current.ex.secs * 1000;
    timerId = setInterval(() => {
      const left = Math.max(0, (end - performance.now()) / 1000);
      clock.innerHTML = Math.ceil(left) + "<small>s</small>";
      if (left <= 0) { stopTimer(); rest("✓", t("nice")); }
    }, 100);
  }

  function stopTimer() { clearInterval(timerId); timerId = 0; }

  function rest(big, msg, unit) {
    const last = current.i + 1 >= current.total;
    app.querySelector(".card").innerHTML = `
      <div class="timer">${esc(big)}${unit ? `<small>${unit}</small>` : ""}</div>
      <p class="meter-say good">${esc(msg)}</p>
      <p class="muted" style="text-align:center">${last ? t("lastOne") : t("rest")}</p>
      <button class="btn btn-teal btn-big" id="act">${last ? t("finish") : t("nextOne")}</button>`;
    app.querySelector("#act").onclick = nextRep;
  }

  function nextRep() {
    current.i++;
    if (current.i < current.total) return rep();
    today().done[current.ex.id] = true; save(); track("done-" + current.ex.id);
    finished(current.ex);
  }

  function finished(ex) {
    current = null;
    const tdy = today(); const next = EX.find((e) => !tdy.done[e.id]);
    const all = !next;
    let extra = "";
    if (ex.id === "ahh" && tdy.ahh.length) extra = `<p style="text-align:center">${t("longestToday", { s: Math.max(...tdy.ahh).toFixed(1) })}</p>`;
    app.innerHTML = `
      <div class="card" style="text-align:center">
        <div class="celebrate" aria-hidden="true">${all ? "🌼" : "👏"}</div>
        <h1>${all ? t("allDone") : t("exDone", { ex: exT(ex.id).name })}</h1>
        ${extra}
        <p class="muted">${all ? (S.name ? esc(S.name) + ", " : "") + t("wonderful") : t("keepGoing")}</p>
      </div>
      ${next ? `<button class="btn btn-primary btn-big" id="next">${t("next")}: ${exT(next.id).name}</button>` : ""}
      <button class="btn btn-ghost" id="home">${t("backHome")}</button>`;
    if (all) track("all-done");
    if (all) speak(t("allDone") + " " + t("wonderful"));
    const n = app.querySelector("#next"); if (n) n.onclick = () => intro(next);
    app.querySelector("#home").onclick = home;
  }

  function settings() {
    app.innerHTML = `
      <div class="top"><button class="icon-btn" id="back">${t("home")}</button><h1>${t("settings")}</h1></div>
      <div class="card">
        <label for="s-name">${t("nameLabel")}<input id="s-name" value="${esc(S.name)}"></label>
        <label for="s-cond">${esc(condText().label)}
          <select id="s-cond">${condOptions()}</select></label>
        <label for="s-target">${t("targetLabel")}
          <select id="s-target">
            <option value="easier">${t("easier")}</option>
            <option value="normal">${t("normal")}</option>
            <option value="harder">${t("harder")}</option>
          </select></label>
        <label for="s-practice">${t("practiceLabel")}
          <select id="s-practice">${languageOptions()}</select></label>
        <label class="check-row" for="s-english" id="s-english-row"><input type="checkbox" id="s-english"> ${t("withEnglish")}</label>
        <label for="s-phrases">${t("phraseModeLabel")}
          <select id="s-phrases">
            <option value="mix">${t("phraseMix")}</option>
            <option value="same">${t("phraseSame")}</option>
          </select></label>
        <label for="s-script">${t("scriptLabel")}
          <select id="s-script">
            <option value="both">${t("scriptBoth")}</option>
            <option value="latin">${t("scriptLatin")}</option>
            <option value="native">${t("scriptNative")}</option>
          </select></label>
        <label for="s-mine">${t("myPhrases")}<textarea id="s-mine">${esc(S.mine.join("\n"))}</textarea></label>
        <button class="btn btn-primary" id="save">${t("save")}</button>
      </div>
      <div class="card" id="about-card">
        <h3>${t("aboutTitle")}</h3>
        ${S.agreedAt ? `<p class="note">${t("agreedOn", { date: new Date(S.agreedAt).toLocaleDateString() })}</p>` : ""}
        <ul class="about">${L().ui.about.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
        <p><b>${t("emergency")}</b></p>
      </div>
      <div class="card" id="privacy-card">
        <h3>${t("privacyTitle")}</h3>
        <ul class="about">${L().ui.privacy.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
      </div>
      <div class="card">
        <h3>${t("resetTitle")}</h3>
        <p class="muted">${t("resetDesc")}</p>
        <button class="btn btn-ghost" id="reset">${t("resetBtn")}</button>
      </div>`;
    app.querySelector("#s-target").value = S.target;
    const sp = app.querySelector("#s-practice"), se = app.querySelector("#s-english");
    sp.value = S.practice; se.checked = S.withEnglish;
    const syncEnglish = () => { app.querySelector("#s-english-row").hidden = sp.value === "en"; };
    sp.onchange = syncEnglish; syncEnglish();
    app.querySelector("#s-script").value = S.script;
    app.querySelector("#s-cond").value = S.condition;
    app.querySelector("#s-phrases").value = S.phraseMode;
    app.querySelector("#back").onclick = home;
    app.querySelector("#save").onclick = () => {
      S.name = app.querySelector("#s-name").value.trim();
      S.target = app.querySelector("#s-target").value;
      if (sp.value !== S.practice) track("practice-" + sp.value);
      S.practice = sp.value; S.withEnglish = se.checked;
      S.script = app.querySelector("#s-script").value;
      S.condition = app.querySelector("#s-cond").value; buildPlan();
      S.phraseMode = app.querySelector("#s-phrases").value;
      S.mine = app.querySelector("#s-mine").value.split("\n").map((x) => x.trim()).filter(Boolean);
      save(); home();
    };
    const reset = app.querySelector("#reset");
    reset.onclick = () => {
      if (reset.dataset.armed) { S.history = {}; save(); home(); return; }
      reset.dataset.armed = "1"; reset.textContent = t("resetConfirm"); reset.className = "btn btn-primary";
    };
  }

  applyLang();
  buildPlan();
  start();
})();
</script>
</html>
